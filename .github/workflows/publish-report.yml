name: Publish Automation Report

on:
  push:
    branches: [main]
    paths:
      - 'target/Issue_persistence.html'
      - '.github/workflows/publish-report.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report website
        run: |
          mkdir -p public
          cp target/Issue_persistence.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
